<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Now Playing Tiny Corner</title>
  <style>
    :root{--bg:rgba(10,12,18,.86);--stroke:rgba(255,255,255,.08);--text:#f4f7fb;--muted:#9ea8ba;--accent:#c4b5fd;--accent2:#93c5fd;--track:rgba(255,255,255,.12);--shadow:0 10px 26px rgba(0,0,0,.28)}
    *{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--text)}
    .stage{width:420px;height:92px;padding:8px;display:flex;align-items:center}.panel{width:404px;height:76px;border-radius:14px;overflow:hidden;display:flex;align-items:center;gap:12px;padding:10px;background:var(--bg);border:1px solid var(--stroke);box-shadow:var(--shadow)}
    .art{width:56px;height:56px;flex:none;border-radius:10px;overflow:hidden;position:relative;background:linear-gradient(135deg,#1d2433,#121720);border:1px solid rgba(255,255,255,.06)} .art img{width:100%;height:100%;object-fit:cover;display:none}.art.has-image img{display:block}
    .placeholder{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(135deg,#1d2433,#121720)} .art.has-image .placeholder{display:none} .placeholder svg{width:22px;height:22px;opacity:.72;color:#d8def0}
    .content{min-width:0;flex:1;height:100%;display:flex;flex-direction:column;justify-content:center;gap:6px}.title{font-size:15px;font-weight:740;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.artist{margin-top:3px;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .bottom{display:flex;align-items:center;gap:8px}.track{height:3px;flex:1;border-radius:999px;overflow:hidden;background:var(--track)} .fill{width:0;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .35s linear}
    .track.indeterminate .fill{width:24%!important;animation:sweep 2.2s ease-in-out infinite}.time{width:44px;flex:none;text-align:right;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}.panel.paused .fill{opacity:.55}@keyframes sweep{0%{transform:translateX(-135%)}100%{transform:translateX(360%)}}
  </style>
</head>
<body>
<div class="stage"><div class="panel" id="panel"><div class="art" id="art"><img id="cover" alt="Album cover"><div class="placeholder"><svg viewBox="0 0 24 24" fill="none"><path d="M12 5a7 7 0 1 0 7 7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="12" cy="12" r="2.1" fill="currentColor"/></svg></div></div><div class="content"><div><div class="title" id="title">Waiting for music…</div><div class="artist" id="artist">Deezer Standalone</div></div><div class="bottom"><div class="track indeterminate" id="track"><div class="fill" id="fill"></div></div><div class="time" id="time">—</div></div></div></div></div>
<script src="overlay.js"></script></body></html>
